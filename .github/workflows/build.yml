name: Build Firmware

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # МАГИЯ BRUCE: Скачиваем файл настроек экрана прямо из их репозитория
      - name: Download T-Embed Display Config
        run: |
          mkdir -p ~/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32/include/config
          wget -O ~/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32/include/config/User_Setup.h https://raw.githubusercontent.com/pr3y/Bruce/main/src/display/User_Setup.h

      - name: Build Firmware
        run: pio run -e esp32dev

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v1
        with:
          files: .pio/build/esp32dev/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
